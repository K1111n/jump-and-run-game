<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>
    <link rel="icon" type="image/x-icon" href="/img/desert.jpg">
    <link rel="stylesheet" href="styles.css">
    <script src="/models/drawable-object.class.js"></script>
    <script src="/models/movable-object.class.js"></script>
    <script src="/models/character.class.js"></script>
    <script src="/models/chicken.class.js"></script>
    <script src="/models/coin.class.js"></script>
    <script src="/models/bottles.class.js"></script>
    <script src="/models/chicken-small.class.js"></script>
    <script src="/models/cloud.class.js"></script>
    <script src="/models/status-bar.class.js"></script>
    <script src="/models/statusBar_endboss.class.js"></script>
    <script src="/models/coinBar.class.js"></script>
    <script src="/models/bottleBar.class.js"></script>
    <script src="/models/world.class.js"></script>
    <script src="/models/background-object.class.js"></script>
    <script src="/models/keyboard.class.js"></script>
    <script src="/models/level.class.js"></script>
    <script src="/models/throwable-object.class.js"></script>
    <script src="/models/endboss.class.js"></script>
    <script src="/models/sound.class.js"></script>
    <script src="/models/controller.class.js"></script>
    <script src="/levels/level1.js"></script>
    <script src="/js/game.js"></script>
</head>

<body onload="init()">

    <h1>El pollo loco</h1>

    <section>
        <button class="responsiveButton">Responsive Design</button>
        <button class="desktopButton">Desktop Design</button>
        <button id="mute-btn" class="mute-button">🔊</button>
    </section>

    <canvas width="720" height="480" id="canvas">

    </canvas>

    <dialog id="startDialog">
        <div class="dialog-content">
            <img src="/img/9_intro_outro_screens/start/startscreen_2.png" alt="Start Screen" class="dialog-image">
            <div class="overlay-content" style="display:flex;">
                <button class="game-button start-button" onclick="startGame()">ENTER/Start Game</button>
                <button class="game-button" style="background: #FF9800;" onclick="showControls()">Controls</button>
                <button class="game-button" style="background: #9C27B0;"><a href="" target="_blank" style="text-decoration: none;">Impressum</a></button>
            </div>
        </div>
    </dialog>

    <div id="mobile-controls">
        <div class="control-pad">
            <button class="control-btn" id="left-btn">←</button>
            <button class="control-btn" id="right-btn">→</button>
            <button class="control-btn" id="jump-btn">↑</button>
            <button class="control-btn" id="throw-btn">🍾</button>
        </div>
    </div>

    <dialog id="pauseDialog">
        <div class="dialog-content" style="padding: 40px; background: #2c3e50; border-radius: 15px;">
            <h2 style="color: white; margin-bottom: 20px;">GAME PAUSED</h2>
            <button class="game-button" id="resume-btn">Resume</button>
            <button class="game-button" id="quit-btn" style="background: #F44336;">Quit to Menu</button>
        </div>
    </dialog>

    <dialog id="controlsDialog">
        <div class="dialog-content" style="background: #2c3e50; padding: 40px; border-radius: 15px; min-width: 400px;">
            <h2 style="color: white; margin-bottom: 30px; font-family: Arial, sans-serif; text-align: center;">CONTROLS</h2>
            <div style="color: white; font-size: 18px; line-height: 2;">
                <p>⬅️  - Move Left</p>
                <p>➡️ - Move Right</p>
                <p>⬆️ - Jump</p>
                <p>SPACEBAR - Throw</p>
                <p>F - Fullscreen</p>
            </div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="game-button" style="background: #607D8B;" onclick="closeControls()">Back</button>
            </div>
        </div>
    </dialog>

    <dialog id="winDialog">
        <div class="dialog-content">
            <img src="/img/You won, you lost/You won A.png" alt="You Won" class="dialog-image" style="height: 475px; width: 720px;">
            <div class="overlay-content">
                <button class="game-button restart-button" onclick="restartGame()">ENTER - Play again</button>
            </div>
        </div>
    </dialog>

    <dialog id="loseDialog">
        <div class="dialog-content">
            <img src="/img/You won, you lost/You lost b.png" alt="Game Over" class="dialog-image" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            <div class="overlay-content">
                <button class="game-button restart-button" onclick="restartGame()">ENTER - Try again</button>
            </div>
        </div>
    </dialog>

    <div id="game-sounds" style="display: none;">
        <audio id="sound-backgroundmusic" src="/sounds/backgroundmusic.mp3" preload="auto"></audio>
        <audio id="sound-jump" src="/sounds/jump.mp3" preload="auto"></audio>
        <audio id="sound-hurt" src="/sounds/hurt.mp3" preload="auto"></audio>
        <audio id="sound-enemyDefeated" src="/sounds/enemyDefeated.mp3" preload="auto"></audio>
        <audio id="sound-youwon" src="/sounds/youwon.mp3" preload="auto"></audio>
        <audio id="sound-youlost" src="/sounds/youlost.mp3" preload="auto"></audio>
    </div>

    </body>

</html>
